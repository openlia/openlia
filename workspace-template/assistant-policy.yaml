$schema: ./assistant-policy.schema.json
version: 1

# User-owned authority defaults. Edit this file to narrow or expand delegation.
delegation:
  workspace:
    enabled: true
    allowed_actions:
      - capture
      - classify
      - create_records
      - update_records
      - archive_records
      - generate_reports
    allowed_domains:
      - inbox
      - sources
      - goals
      - knowledge
      - tasks
      - calendar
      - archive
  memory:
    direct_reports: record
    observations: candidate
    inferences: candidate
  external:
    # ask | allow | deny; keep external side effects gated unless configured.
    send_messages: ask
    modify_external_calendar: ask
    purchases: ask
    financial_transactions: ask
  destructive:
    delete_records: ask
    overwrite_records: ask

scheduled_work:
  enabled: true
  allowed_actions:
    - capture
    - classify
    - create_records
    - update_records
    - archive_records
    - generate_reports
  report_destination: inbox/daily-briefing

audit:
  report_authority: true
  preserve_source: true
