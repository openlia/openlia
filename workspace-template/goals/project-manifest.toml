[project]
id = "goals"
name = "Goals"
description = "Outcomes, target completion dates, and review rhythms."
icon = "target"

[data]
template = "goal-template.md"
schema = "goal-template.schema.json"

[data.queries]
active_goals = { op = "count_by", field = "status", value = "active" }
completed_goals = { op = "count_by", field = "status", value = "completed" }
paused_goals = { op = "count_by", field = "status", value = "paused" }

[ui]
entry = "ui.openui"

[logic]
skills = ["weekly-review"]

[logic.mutations]
update_status = { type = "frontmatter", field = "status" }

[[logic.prompts]]
label = "Review active goals & milestones"
prompt = "Review my active goals in goals/ and summarize which milestones need attention this week."
