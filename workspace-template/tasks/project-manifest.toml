[project]
id = "tasks"
name = "Tasks"
description = "Concrete next actions, priorities, and completion status."
icon = "check-square"

[data]
template = "task-template.md"
schema = "task-template.schema.json"

[data.queries]
todo_count = { op = "count_by", field = "status", value = "todo" }
in_progress_count = { op = "count_by", field = "status", value = "in-progress" }
done_count = { op = "count_by", field = "status", value = "done" }
high_priority_count = { op = "count_by", field = "priority", value = "high" }

[ui]
entry = "ui.openui"

[logic]
skills = ["inbox-triage", "weekly-review"]

[logic.mutations]
update_status = { type = "frontmatter", field = "status" }
update_priority = { type = "frontmatter", field = "priority" }

[[logic.prompts]]
label = "Triage overdue & high-priority tasks"
prompt = "Review my tasks in tasks/ and highlight overdue or high-priority items that need attention today."

[[logic.prompts]]
label = "Add priority filter or chart"
prompt = "Update tasks/ui.openui and tasks/project-manifest.toml to add a priority breakdown metric or filter."
