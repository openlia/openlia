  - ingestion_recover
  - save_document_password
  - list_document_password_profiles
  - delete_document_password_profile
  - ingestion_suggest_passwords
  - retry_ingestion_with_password_profile
  - ingestion_search
  - ingestion_get_document
  - ingestion_update_document
  - ingestion_tag
