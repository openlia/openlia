services:
  hermes:
    image: "${OPENLIA_HERMES_IMAGE:?OPENLIA_HERMES_IMAGE is required}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        HERMES_BASE_IMAGE: "${HERMES_BASE_IMAGE:?HERMES_BASE_IMAGE is required}"
        HERMES_BASE_TAG: "${HERMES_BASE_TAG:?HERMES_BASE_TAG is required}"
        HERMES_BASE_DIGEST: "${HERMES_BASE_DIGEST:?HERMES_BASE_DIGEST is required}"
        BUN_VERSION: "${BUN_VERSION:-1.2.22}"
        BUN_X86_64_SHA256: "${BUN_X86_64_SHA256:-4c446af1a01d7b40e1e11baebc352f9b2bfd12887e51b97dd3b59879cee2743a}"
        BUN_AARCH64_SHA256: "${BUN_AARCH64_SHA256:-a97c687fb5e54de4e2fb0869a7ac9a2d9c3af75ac182e2b68138c1dd8f98131b}"
        UV_VERSION: "${UV_VERSION:-0.8.14}"
        UV_X86_64_SHA256: "${UV_X86_64_SHA256:-954add045f29f93191523175e4aea066996840e86c1b6339dee25f48b15b5ddb}"
        UV_AARCH64_SHA256: "${UV_AARCH64_SHA256:-69616218470b2ad053617efb9e7027b1518ea38918d933c2791e113d99cec507}"
        DEBIAN_SNAPSHOT: "${DEBIAN_SNAPSHOT:-20260801T000000Z}"
        OPENLIA_PROJECT_NAME: "${OPENLIA_PROJECT_NAME:-openlia}"
    command: ["gateway", "run"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:rw,exec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=512m
      - /opt/openlia/npm-cache:rw,exec,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: "${OPENLIA_DATA_ROOT:?OPENLIA_DATA_ROOT is required}"
        target: /opt/data
      - type: bind
        source: "${OPENLIA_SYSTEM_SKILLS_ROOT:?OPENLIA_SYSTEM_SKILLS_ROOT is required}/openlia-skill-migration"
        target: /opt/data/skills/openlia-skill-migration
        read_only: true
      - type: bind
        source: "${OPENLIA_SYSTEM_SKILLS_ROOT:?OPENLIA_SYSTEM_SKILLS_ROOT is required}/workspace-template-customization"
        target: /opt/data/skills/workspace-template-customization
        read_only: true
      - type: bind
        source: "${OPENLIA_SECRET_DIR:?OPENLIA_SECRET_DIR is required}"
        target: /run/openlia-secrets
        read_only: true
    # bootstrap creates /opt/data/config.yaml with Hermes secrets.command
    # enabled; this read-only runtime directory is its only credential input.
    environment:
      HERMES_HOME: /opt/data
      NPM_CONFIG_CACHE: /opt/openlia/npm-cache
      OPENLIA_PROVIDER: "${OPENLIA_PROVIDER:-copilot}"
      OPENLIA_MODEL: "${OPENLIA_MODEL:-gpt-5.6-luna}"
      OPENLIA_OUTPUT_LANGUAGE: "${OPENLIA_OUTPUT_LANGUAGE:-en}"
      HERMES_TIMEZONE: "${HERMES_TIMEZONE:-Asia/Ho_Chi_Minh}"
      TZ: "${HERMES_TIMEZONE:-Asia/Ho_Chi_Minh}"
      OPENLIA_SECRET_FILE_IN_CONTAINER: /run/openlia-secrets/hermes.env
      GIT_TERMINAL_PROMPT: "0"
      GIT_EDITOR: "true"
      HERMES_WRITE_SAFE_ROOT: /opt/data
      OPENLIA_WORKSPACE_ROOT: /opt/data/workspace
      HERMES_CONTAINER: "1"
      HERMES_DISABLE_LAZY_INSTALLS: "1"
    networks:
      - openlia-private
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  backup-scheduler:
    image: "${OPENLIA_BACKUP_SCHEDULER_IMAGE:?OPENLIA_BACKUP_SCHEDULER_IMAGE is required}"
    profiles: ["backup"]
    build:
      context: ..
      dockerfile: docker/backup-scheduler.Dockerfile
      args:
        BACKUP_SCHEDULER_BASE_IMAGE: "${BACKUP_SCHEDULER_BASE_IMAGE:-debian}"
        BACKUP_SCHEDULER_BASE_TAG: "${BACKUP_SCHEDULER_BASE_TAG:-13.4-slim}"
        BACKUP_SCHEDULER_BASE_DIGEST: "${BACKUP_SCHEDULER_BASE_DIGEST:-sha256:109e2c65005bf160609e4ba6acf7783752f8502ad218e298253428690b9eaa4b}"
        DEBIAN_SNAPSHOT: "${DEBIAN_SNAPSHOT:-20260801T000000Z}"
    entrypoint: ["/usr/local/bin/openlia-backup-scheduler"]
    restart: unless-stopped
    environment:
      OPENLIA_OPERATOR_CONFIG_FILE: /etc/openlia/backup-schedule-config.json
      OPENLIA_BACKUP_KNOWN_HOSTS: /etc/ssh/known_hosts
      OPENLIA_RUNTIME_UID: "${OPENLIA_RUNTIME_UID:?OPENLIA_RUNTIME_UID is required}"
      OPENLIA_RUNTIME_GID: "${OPENLIA_RUNTIME_GID:?OPENLIA_RUNTIME_GID is required}"
      TZ: "${HERMES_TIMEZONE:-Asia/Ho_Chi_Minh}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_PROFILE: "${AWS_PROFILE:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      AWS_SDK_LOAD_CONFIG: "1"
    read_only: true
    pids_limit: 64
    tmpfs:
      - /run:rw,exec,nosuid,size=16m
      - /tmp:rw,exec,nosuid,size=64m
    volumes:
      - type: bind
        source: "${OPENLIA_DATA_ROOT:?OPENLIA_DATA_ROOT is required}"
        target: /runtime/hermes
        read_only: true
      - type: bind
        source: "${OPENLIA_META_ROOT:?OPENLIA_META_ROOT is required}"
        target: /runtime/meta
      - type: bind
        source: "${OPENLIA_BACKUP_ROOT:?OPENLIA_BACKUP_ROOT is required}"
        target: /runtime/backups
      - type: bind
        source: "${OPENLIA_META_ROOT:?OPENLIA_META_ROOT is required}/backup-schedule-config.json"
        target: /etc/openlia/backup-schedule-config.json
        read_only: true
      - type: bind
        source: "${OPENLIA_OPERATION_LOCK:?OPENLIA_OPERATION_LOCK is required}"
        target: /run/openlia/operation.lock
      - type: bind
        source: "${OPENLIA_BACKUP_KNOWN_HOSTS_SOURCE:-/dev/null}"
        target: /etc/ssh/known_hosts
        read_only: true
      - type: bind
        source: "${OPENLIA_AWS_CREDENTIALS_SOURCE:-/dev/null}"
        target: /root/.aws/credentials
        read_only: true
      - type: bind
        source: "${OPENLIA_AWS_CONFIG_SOURCE:-/dev/null}"
        target: /root/.aws/config
        read_only: true
    networks:
      - openlia-private
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/openlia/last-success && test -n \"$$(find /run/openlia/last-success -mmin -3 -print)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  openlia-private:
    name: "${OPENLIA_NETWORK_NAME:?OPENLIA_NETWORK_NAME is required}"
    driver: bridge
