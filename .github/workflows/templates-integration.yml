name: Runtime and templates integration

on:
  pull_request:
    paths:
      - "operator/**"
      - "packages/workspace-ui/**"
      - "release/**"
      - "internal/releaseinfo/**"
      - "cmd/release-manifest/**"
      - "scripts/test_templates_integration.py"
      - "tests/test_templates_integration.py"
      - "tests/test_install_remind.py"
      - "requirements-templates-integration.txt"
      - "docker/install-remind.py"
      - ".github/workflows/templates-integration.yml"
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "packages/workspace-ui/**"
      - "release/**"
      - "scripts/test_templates_integration.py"
      - "tests/test_templates_integration.py"
      - "tests/test_install_remind.py"
      - "requirements-templates-integration.txt"
      - "docker/install-remind.py"
      - ".github/workflows/templates-integration.yml"
  workflow_dispatch:
    inputs:
      runtime_ref:
        description: "Runtime ref (branch, tag, full SHA, or refs/pull/N/head)"
        required: true
        default: main
        type: string
      templates_ref:
        description: "Templates ref; blank uses the runtime release manifest's pinned SHA"
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out runtime revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.runtime_ref || github.sha }}
          persist-credentials: false
          path: runtime
      - name: Resolve templates selection
        id: templates
        env:
          REQUESTED_REF: ${{ inputs.templates_ref }}
        run: |
          python3 - <<'PY'
          import json, os, re
          pin = json.load(open('runtime/release/manifest.json'))['templates']
          ref = os.environ.get('REQUESTED_REF') or pin['revision']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]*', ref) or '..' in ref:
              raise SystemExit('Invalid templates ref')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ref={ref}\n')
          PY
      - name: Check out templates revision
        uses: actions/checkout@v4
        with:
          repository: openlia/templates
          ref: ${{ steps.templates.outputs.ref }}
          persist-credentials: false
          path: templates
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements-templates-integration.txt
      - name: Install native Calendar dependencies
        working-directory: runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev make tzdata
          version="$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["remind"]["version"])')"
          prefix="${RUNNER_TEMP}/openlia-remind/${version}"
          python3 docker/install-remind.py --prefix "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "OPENLIA_REMIND_BINARY=$prefix/bin/remind" >> "$GITHUB_ENV"
      - name: Install validation dependencies
        run: python -m pip install -r runtime/requirements-templates-integration.txt
      - name: Install locked JavaScript dependencies
        working-directory: runtime
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and browser dependencies
        working-directory: runtime/packages/workspace-ui
        run: bunx --no-install playwright install --with-deps chromium
      - name: Test integration runner
        working-directory: runtime
        run: python -m unittest discover -s tests -p test_templates_integration.py
      - name: Test pinned source installer safeguards
        working-directory: runtime
        run: python -m unittest discover -s tests -p test_install_remind.py
      - name: Test selected runtime and templates together
        working-directory: runtime
        run: python scripts/test_templates_integration.py --templates-root ../templates --docker --remind-binary "$OPENLIA_REMIND_BINARY"
      - name: Publish paired-revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-templates-integration
          path: |
            runtime/.artifacts/templates-integration/
            runtime/packages/workspace-ui/.playwright/templates-results/
            runtime/packages/workspace-ui/.playwright/templates-report/
          if-no-files-found: warn
          include-hidden-files: true
