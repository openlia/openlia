name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check JavaScript source
        run: bun run check

      - name: Test JavaScript packages
        run: bun run test

      - name: Build and verify generated release inputs
        run: bun run verify-dist

      - name: Reject tracked generated distributions
        run: test -z "$(git ls-files -- 'packages/*/dist/**')"

      - name: Test and vet Go source
        run: |
          go test ./...
          go vet ./...

      - name: Validate workspace templates
        run: make workspace-templates-test

      - name: Build release binaries
        run: make build

      - name: Build Workspace UI image
        run: docker build --file docker/workspace-ui.Dockerfile --tag openlia-workspace-ui:ci .

      - name: Build Hermes ingestion image
        run: |
          set -a
          . docker/.env.example
          set +a
          docker build \
            --build-arg HERMES_BASE_IMAGE="$HERMES_BASE_IMAGE" \
            --build-arg HERMES_BASE_TAG="$HERMES_BASE_TAG" \
            --build-arg HERMES_BASE_DIGEST="$HERMES_BASE_DIGEST" \
            --build-arg OPENLIA_PROJECT_NAME=ci \
            --file docker/Dockerfile \
            --tag openlia-hermes:ci \
            .

      - name: Verify Hermes ingestion dependencies
        run: >-
          docker run --rm --entrypoint sh
          --volume "$PWD/docker/verify-tools.sh:/tmp/verify-tools.sh:ro"
          openlia-hermes:ci /tmp/verify-tools.sh

      - name: Verify Hermes workspace validator dependency
        run: >-
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python
          openlia-hermes:ci -c "import jsonschema; print(jsonschema.__name__)"
