name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Verify release manifest sync
        run: go run ./cmd/release-manifest check

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck Bun packages
        run: bun run check

      - name: Run Bun tests
        run: bun run test

      - name: Build and verify embedded Bun bundles
        run: bun run verify-dist

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l main.go main_test.go cli cmd internal operator)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Run Go vet and tests
        run: |
          make build-operator
          go vet ./...
          go test ./...

      - name: Run ShellCheck on operational scripts
        run: shellcheck docker/secret-source.sh

      - name: Build release artifacts
        run: make build

      - name: Run CLI smoke harness
        run: python3 tests/smoke.py --mode cli --openlia-bin ./openlia

      - name: Build and verify OpenLia Hermes container image
        run: |
          eval "$(python3 - <<'PY'
          import json, shlex
          with open("release/manifest.json", "r", encoding="utf-8") as fh:
              data = json.load(fh)
          hermes = data["components"]["hermes"]
          values = {
              "HERMES_BASE_IMAGE": hermes["image"],
              "HERMES_BASE_TAG": hermes["tag"],
              "HERMES_BASE_DIGEST": hermes["digest"],
          }
          for key, value in values.items():
              print(f"export {key}={shlex.quote(str(value))}")
          PY
          )"
          docker build \
            --build-arg "HERMES_BASE_IMAGE=${HERMES_BASE_IMAGE}" \
            --build-arg "HERMES_BASE_TAG=${HERMES_BASE_TAG}" \
            --build-arg "HERMES_BASE_DIGEST=${HERMES_BASE_DIGEST}" \
            -f docker/Dockerfile \
            -t openlia-hermes:ci \
            .
          docker run --rm --entrypoint /bin/sh openlia-hermes:ci -lc 'test -x /usr/local/bin/openlia-secret-source'
