name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Verify release manifest sync
        run: go run ./cmd/release-manifest check

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck Bun packages
        run: bun run check

      - name: Lint and format-check documentation
        run: bun run docs:check

      - name: Run Bun tests
        run: bun run test

      - name: Build and verify embedded Bun bundles
        run: bun run verify-dist

      - name: Build and health-check Workspace UI container image
        run: |
          docker build -f docker/workspace-ui.Dockerfile -t openlia-workspace-ui:ci .
          docker run --rm --read-only \
            --tmpfs /tmp \
            --tmpfs /workspace:rw,uid=10000,gid=10000,mode=0700 \
            --tmpfs /skills:rw,uid=10000,gid=10000,mode=0700 \
            -e OPENLIA_WORKSPACE_ROOT=/workspace \
            -e OPENLIA_WORKSPACE_UI_SKILLS_ROOT=/skills \
            -e OPENLIA_WORKSPACE_UI_BIND=0.0.0.0 \
            -e OPENLIA_WORKSPACE_UI_AUTH_REQUIRED=false \
            --entrypoint bun \
            openlia-workspace-ui:ci \
            -e 'const { server } = await import("/opt/openlia/workspace-ui/server.js"); const base = `http://127.0.0.1:${server.port}`; const assert = (condition, message) => { if (!condition) throw new Error(message) }; const health = await fetch(`${base}/health`); assert(health.ok, "health failed"); const created = await fetch(`${base}/api/skills/file/create`, { method: "POST", headers: { "Content-Type": "application/json", Origin: base }, body: JSON.stringify({ path: "ci-check/SKILL.md", content: "---\\nname: ci-check\\n---\\n" }) }); assert(created.status === 200, `skill create failed: ${created.status}`); const skills = await (await fetch(`${base}/api/skills/tree`)).json(); assert(skills.entries.some((entry) => entry.path === "ci-check/SKILL.md"), "skill missing from skills scope"); const workspace = await (await fetch(`${base}/api/workspace/tree`)).json(); assert(!workspace.entries.some((entry) => entry.path === "ci-check/SKILL.md"), "skill leaked into workspace scope"); const deepLink = await fetch(`${base}/skills/ci-check/SKILL.md`); assert(deepLink.ok && deepLink.headers.get("content-type")?.includes("text/html"), "skills deep link failed"); const removed = await fetch(`${base}/api/skills/directory`, { method: "DELETE", headers: { "Content-Type": "application/json", Origin: base }, body: JSON.stringify({ path: "ci-check", scope: "skills" }) }); assert(removed.ok, "skill folder delete failed"); server.stop();'

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l main.go main_test.go cli cmd internal operator)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Run Go vet and tests
        run: |
          make build-operator
          go vet ./...
          go test ./...

      - name: Run ShellCheck on operational scripts
        run: shellcheck docker/secret-source.sh

      - name: Build release artifacts
        run: make build

      - name: Run CLI smoke harness
        run: python3 tests/smoke.py --mode cli --openlia-bin ./openlia

      - name: Build and verify OpenLia Hermes container image
        run: |
          eval "$(python3 - <<'PY'
          import json, shlex
          with open("release/manifest.json", "r", encoding="utf-8") as fh:
              data = json.load(fh)
          hermes = data["components"]["hermes"]
          values = {
              "HERMES_BASE_IMAGE": hermes["image"],
              "HERMES_BASE_TAG": hermes["tag"],
              "HERMES_BASE_DIGEST": hermes["digest"],
          }
          for key, value in values.items():
              print(f"export {key}={shlex.quote(str(value))}")
          PY
          )"
          docker build \
            --build-arg "HERMES_BASE_IMAGE=${HERMES_BASE_IMAGE}" \
            --build-arg "HERMES_BASE_TAG=${HERMES_BASE_TAG}" \
            --build-arg "HERMES_BASE_DIGEST=${HERMES_BASE_DIGEST}" \
            -f docker/Dockerfile \
            -t openlia-hermes:ci \
            .
          docker run --rm --entrypoint /bin/sh openlia-hermes:ci -lc 'test -x /usr/local/bin/openlia-secret-source'
          docker run --rm \
            -e OPENLIA_WORKSPACE_UI_PUBLIC_ORIGIN=https://workspace.example.test \
            --entrypoint /opt/hermes/.venv/bin/python \
            openlia-hermes:ci \
            -c 'from gateway.platforms.base import BasePlatformAdapter; assert getattr(BasePlatformAdapter.send, "_openlia_patched", False); from openlia_link_rewriter import rewrite_openlia_links; assert rewrite_openlia_links("openlia://workspace/docs/start.md") == "https://workspace.example.test/files/docs/start.md"; assert rewrite_openlia_links("openlia://skills/weather/SKILL.md") == "https://workspace.example.test/skills/weather/SKILL.md"'
