[project]
id = "decisions"
name = "Decisions"
description = "Decision logs, trade-off analyses, and review dates."
icon = "scale"

[data]
template = "decision-template.md"
schema = "decision-template.schema.json"

[data.queries]
proposed_count = { op = "count_by", field = "status", value = "proposed" }
review_count = { op = "count_by", field = "status", value = "under-review" }
decided_count = { op = "count_by", field = "status", value = "decided" }

[ui]
entry = "ui.openui"

[logic]
skills = ["decision-analysis"]

[logic.mutations]
update_status = { type = "frontmatter", field = "status" }

[[logic.prompts]]
label = "Review pending decisions"
prompt = "Review decisions in decisions/ with status proposed or under-review and help me weigh the options."
