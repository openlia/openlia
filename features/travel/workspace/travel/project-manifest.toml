[project]
id = "travel"
name = "Travel"
description = "Trip itineraries, dates, destinations, and booking status."
icon = "compass"

[data]
template = "trip-template.md"
schema = "trip-template.schema.json"

[data.queries]
planning_trips = { op = "count_by", field = "status", value = "planning" }
booked_trips = { op = "count_by", field = "status", value = "booked" }
completed_trips = { op = "count_by", field = "status", value = "completed" }

[ui]
entry = "ui.openui"

[logic]
[logic.mutations]
update_status = { type = "frontmatter", field = "status" }

[[logic.prompts]]
label = "Plan upcoming trip checklist"
prompt = "Review my upcoming trips in travel/ and suggest missing logistics or booking items."
