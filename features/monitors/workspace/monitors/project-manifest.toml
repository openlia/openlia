[project]
id = "monitors"
name = "Monitors"
description = "Recurring watch topics, check frequencies, and alert triggers."
icon = "radar"

[data]
template = "monitor-template.md"
schema = "monitor-template.schema.json"

[data.queries]
active_monitors = { op = "count_by", field = "status", value = "active" }
triggered_monitors = { op = "count_by", field = "status", value = "triggered" }
paused_monitors = { op = "count_by", field = "status", value = "paused" }

[ui]
entry = "ui.openui"

[logic]
[logic.mutations]
update_status = { type = "frontmatter", field = "status" }

[[logic.prompts]]
label = "Check active monitors"
prompt = "Review active monitors in monitors/ and summarize which ones are due for a check."
