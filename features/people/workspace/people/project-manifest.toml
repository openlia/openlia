[project]
id = "people"
name = "People"
description = "Relationship directory, organizations, roles, and last-contacted dates."
icon = "users"

[data]
template = "person-template.md"
schema = "person-template.schema.json"

[data.queries]
colleagues_count = { op = "count_by", field = "relationship", value = "colleague" }
collaborators_count = { op = "count_by", field = "relationship", value = "collaborator" }
friends_count = { op = "count_by", field = "relationship", value = "friend" }

[ui]
entry = "ui.openui"

[logic]
[logic.mutations]
update_relationship = { type = "frontmatter", field = "relationship" }

[[logic.prompts]]
label = "Who should I reconnect with?"
prompt = "Review records in people/ and highlight contacts I haven't spoken with recently."
