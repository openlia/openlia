[project]
id = "shopping"
name = "Shopping"
description = "Purchase research, price comparisons, budgets, and buying status."
icon = "shopping-bag"

[data]
template = "item-template.md"
schema = "item-template.schema.json"

[data.queries]
researching_count = { op = "count_by", field = "status", value = "researching" }
ready_count = { op = "count_by", field = "status", value = "ready-to-buy" }
total_budget = { op = "sum_by", field = "budget" }

[ui]
entry = "ui.openui"

[logic]
[logic.mutations]
update_status = { type = "frontmatter", field = "status" }

[[logic.prompts]]
label = "Compare researching items"
prompt = "Review items in shopping/ with status researching or ready-to-buy and summarize budget vs target price."
